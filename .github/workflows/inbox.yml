name: Miro Inbox Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: miro-inbox-bot
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - run: pip install requests

      - run: python bot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MIRO_ACCESS_TOKEN: ${{ secrets.MIRO_ACCESS_TOKEN }}
          MIRO_BOARD_ID: ${{ secrets.MIRO_BOARD_ID }}
          ALLOWED_CHAT_ID: ${{ secrets.ALLOWED_CHAT_ID }}

      - name: Persist state
        if: always()
        run: |
          git config user.name "miro-inbox-bot"
          git config user.email "actions@github.com"
          git add state/
          git diff --cached --quiet || git commit -m "Update bot state"
          git push
